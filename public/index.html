<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Feed</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>Activity Feed</h1>

<div class="container">
    <div class="posts">
        <h2>Новый пост</h2>
        <div class="form-group">
            <input type="text" id="author" placeholder="ваше имя" value="user">
        </div>
        <div class="form-group">
            <textarea id="text" placeholder="что у вас нового?" rows="3"></textarea>
        </div>
        <div class="form-group">
            <button onclick="createPost()">Опубликовать</button>
        </div>

        <h2>Лента</h2>
        <div id="posts-container"></div>
    </div>

    <div class="logs">
        <div class="logs-header">
            <h3>События</h3>
            <button class="clear-logs-btn" id="clearLogsBtn">Очистить</button>
        </div>
        <div id="logs"></div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
